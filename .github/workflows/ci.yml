name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Tests
        run: pytest -q

  example:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Build the example dataset
        run: python examples/make_demo.py examples/demo
      - name: The example dataset must validate cleanly
        run: |
          python -m signlab.cli validate --dataset examples/demo
      - name: Evaluate the example split
        run: |
          python -m signlab.cli evaluate --dataset examples/demo --split val \
            --predictions examples/demo/predictions.jsonl \
            --fail-under-map50 0.5 --out metrics.json
      - uses: actions/upload-artifact@v4
        with:
          name: example-report
          path: metrics.json
