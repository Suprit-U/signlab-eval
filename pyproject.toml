[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "signlab-eval"
version = "0.1.0"
description = "Dataset QA and reproducible mAP evaluation for YOLO-format object detection projects."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Suprit U", email = "supritu4@gmail.com" }]
keywords = ["object-detection", "yolo", "dataset", "mAP", "evaluation", "computer-vision"]
dependencies = []
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Image Recognition",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]
ultralytics = ["ultralytics>=8.1"]

[project.scripts]
signlab = "signlab.cli:main"

[project.urls]
Homepage = "https://github.com/Suprit-U/signlab-eval"
Repository = "https://github.com/Suprit-U/signlab-eval"
Issues = "https://github.com/Suprit-U/signlab-eval/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
